<svg width="760" height="270" viewBox="0 0 760 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated system architecture overview</title>
  <desc id="desc">A subtle animated diagram showing product interfaces flowing through API, services, queues, data, observability, and cloud infrastructure.</desc>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-2: #0f172a;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --blue: #38bdf8;
      --green: #34d399;
      --violet: #a78bfa;
      --amber: #fbbf24;
    }

    .card {
      fill: var(--panel);
      stroke: rgba(148, 163, 184, 0.32);
      stroke-width: 1;
    }

    .core {
      fill: var(--panel-2);
      stroke: rgba(56, 189, 248, 0.72);
      stroke-width: 1.4;
      filter: url(#softGlow);
    }

    .label {
      fill: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .caption {
      fill: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      letter-spacing: 0;
    }

    .wire {
      stroke: var(--line);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 5 7;
      animation: drift 4.8s linear infinite;
    }

    .pulse-blue {
      animation: pulseBlue 3.6s ease-in-out infinite;
    }

    .pulse-green {
      animation: pulseGreen 4.1s ease-in-out infinite;
    }

    .pulse-violet {
      animation: pulseViolet 4.6s ease-in-out infinite;
    }

    .spark {
      filter: url(#sparkGlow);
    }

    @keyframes drift {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -48; }
    }

    @keyframes pulseBlue {
      0%, 100% { stroke: rgba(56, 189, 248, 0.45); }
      50% { stroke: rgba(56, 189, 248, 0.95); }
    }

    @keyframes pulseGreen {
      0%, 100% { stroke: rgba(52, 211, 153, 0.42); }
      50% { stroke: rgba(52, 211, 153, 0.9); }
    }

    @keyframes pulseViolet {
      0%, 100% { stroke: rgba(167, 139, 250, 0.38); }
      50% { stroke: rgba(167, 139, 250, 0.88); }
    }
  </style>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="760" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617" />
      <stop offset="0.48" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="haloBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 128) rotate(90) scale(126 320)">
      <stop stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#38bdf8" flood-opacity="0.26" />
    </filter>
    <filter id="sparkGlow" x="-160%" y="-160%" width="420%" height="420%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="760" height="270" rx="18" fill="url(#bgGradient)" />
  <rect width="760" height="270" rx="18" fill="url(#haloBlue)" />
  <rect x="0.5" y="0.5" width="759" height="269" rx="17.5" stroke="rgba(148, 163, 184, 0.2)" />

  <text x="32" y="38" class="label">Architecture-first product engineering</text>
  <text x="32" y="57" class="caption">React, Next.js, Node.js, NestJS, queues, databases, observability, and cloud delivery</text>

  <path id="flow-1" class="wire pulse-blue" d="M158 122 C204 122 218 122 264 122" />
  <path id="flow-2" class="wire pulse-green" d="M376 122 C418 122 434 122 478 122" />
  <path id="flow-3" class="wire pulse-violet" d="M376 122 C424 158 430 194 478 194" />
  <path id="flow-4" class="wire pulse-blue" d="M589 122 C634 122 650 88 696 88" />
  <path id="flow-5" class="wire pulse-green" d="M589 194 C632 194 650 228 696 228" />
  <path id="flow-6" class="wire pulse-violet" d="M264 122 C218 158 204 194 158 194" />

  <circle r="4" fill="#38bdf8" class="spark">
    <animateMotion dur="3.8s" repeatCount="indefinite">
      <mpath href="#flow-1" />
    </animateMotion>
  </circle>
  <circle r="4" fill="#34d399" class="spark">
    <animateMotion dur="4.2s" begin="0.3s" repeatCount="indefinite">
      <mpath href="#flow-2" />
    </animateMotion>
  </circle>
  <circle r="4" fill="#a78bfa" class="spark">
    <animateMotion dur="4.7s" begin="0.6s" repeatCount="indefinite">
      <mpath href="#flow-3" />
    </animateMotion>
  </circle>

  <g transform="translate(42 88)">
    <rect class="card" width="116" height="68" rx="12" />
    <circle cx="22" cy="24" r="7" fill="#38bdf8" opacity="0.95" />
    <text x="40" y="28" class="label">Product UI</text>
    <text x="22" y="50" class="caption">Next.js + React</text>
  </g>

  <g transform="translate(264 76)">
    <rect class="core" width="112" height="92" rx="14" />
    <path d="M34 46h44M56 24v44M42 32l28 28M70 32 42 60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <text x="25" y="76" class="label">API Core</text>
  </g>

  <g transform="translate(478 88)">
    <rect class="card" width="111" height="68" rx="12" />
    <circle cx="22" cy="24" r="7" fill="#34d399" opacity="0.95" />
    <text x="40" y="28" class="label">Services</text>
    <text x="22" y="50" class="caption">RBAC + audits</text>
  </g>

  <g transform="translate(42 176)">
    <rect class="card" width="116" height="58" rx="12" />
    <circle cx="22" cy="22" r="6" fill="#fbbf24" opacity="0.95" />
    <text x="40" y="26" class="label">Ops UX</text>
    <text x="22" y="45" class="caption">Dashboards</text>
  </g>

  <g transform="translate(478 176)">
    <rect class="card" width="111" height="58" rx="12" />
    <circle cx="22" cy="22" r="6" fill="#a78bfa" opacity="0.95" />
    <text x="40" y="26" class="label">Queues</text>
    <text x="22" y="45" class="caption">Async jobs</text>
  </g>

  <g transform="translate(626 52)">
    <rect class="card" width="96" height="58" rx="12" />
    <text x="22" y="27" class="label">Data</text>
    <text x="22" y="45" class="caption">SQL + NoSQL</text>
  </g>

  <g transform="translate(626 204)">
    <rect class="card" width="96" height="42" rx="12" />
    <text x="18" y="26" class="label">Cloud</text>
  </g>
</svg>
